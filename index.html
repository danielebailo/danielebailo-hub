<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Daniele Bailo</title>
  <meta name="description" content="Daniele Bailo — personal and professional websites.">
  <style>
    :root{--bg:#fff;--ink:#111;--muted:#747474;--line:#ded8cf;--accent:#9a3412;--soft:#f7f3ee}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:34px;color:var(--ink);background:var(--bg);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45}
    a{color:inherit;text-decoration:none}
    .name{font-family:ui-serif,Georgia,Cambria,"Times New Roman",Times,serif;font-weight:500;letter-spacing:-.055em}
    .card{width:min(980px,100%);min-height:360px;border:1px solid var(--line);padding:clamp(28px,5vw,52px);background:#fff;position:relative;display:grid;grid-template-columns:1fr minmax(220px,310px) 1fr;grid-template-rows:1fr auto 1fr;gap:clamp(22px,4vw,44px);align-items:center}
    .identity{grid-column:2;grid-row:1 / 4;text-align:center;align-self:center}
    .photo{display:block;width:min(230px,100%);aspect-ratio:1/1;margin:0 auto 24px;object-fit:cover;object-position:center top;background:var(--soft);border-radius:50%}
    .name{margin:0;font-size:clamp(42px,5vw,66px);line-height:.9}
    .link{border-top:1px solid var(--line);padding-top:18px}
    .link.personal{grid-column:3;grid-row:1;align-self:start}
    .link.work{grid-column:1;grid-row:3;align-self:end;text-align:right}
    .title{font-size:clamp(22px,2.5vw,30px);font-weight:500;letter-spacing:-.025em}
    .keys{margin-top:8px;font-size:15px;color:var(--muted)}
    .url{margin-top:12px;font-size:13px;color:var(--accent);font-weight:700}
    .link:hover .title{color:var(--accent)}
    .email{grid-column:3;grid-row:3;align-self:end;justify-self:end;color:var(--muted);font-size:13px}
    @media(max-width:780px){body{place-items:start center}.card{grid-template-columns:1fr;grid-template-rows:auto;gap:34px}.identity,.link.personal,.link.work,.email{grid-column:1;grid-row:auto}.link.work{text-align:left}.email{justify-self:start}.identity{order:-1}.photo{width:180px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="identity">
      <img id="hub-photo" class="photo" src="assets/photos/hub-photo-01.jpg" alt="Daniele Bailo">
      <h1 class="name">Daniele Bailo</h1>
    </div>
    <a class="link work" href="https://work.danielebailo.it">
      <div class="title">Work</div>
      <div class="keys">AI · Geoscience · Data · Philosophy</div>
      <div class="url">work.danielebailo.it</div>
    </a>
    <a class="link personal" href="https://personal.danielebailo.it">
      <div class="title">Personal</div>
      <div class="keys">Appunti · Canzoni · Cose</div>
      <div class="url">personal.danielebailo.it</div>
    </a>
    <div class="email">daniele@danielebailo.it</div>
  </main>

  <script>
    const photos = [
      "assets/photos/hub-photo-01.jpg",
      "assets/photos/hub-photo-02.jpg",
      "assets/photos/hub-photo-03.jpg",
      "assets/photos/hub-photo-04.jpg",
      "assets/photos/hub-photo-05.jpg",
      "assets/photos/hub-photo-06.jpg",
      "assets/photos/hub-photo-07.jpg",
      "assets/photos/hub-photo-08.jpg"
    ];
    document.getElementById("hub-photo").src = photos[Math.floor(Math.random() * photos.length)];
  </script>
</body>
</html>
